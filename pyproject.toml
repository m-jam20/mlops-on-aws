[project]
name = "churn"
version = "0.1.0"
description = "Customer churn model, from laptop to autoscaling deployment on AWS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "pre-commit>=4",
    "httpx2>=2.16.0",
]
train = [
    "mlflow>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Installed locally by `uv sync`; the Docker image skips "train" (no mlflow).
default-groups = ["dev", "train"]
